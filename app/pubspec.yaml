name: emolens
description: EmoLens - Live emotion recognition for individuals with Down syndrome
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  fl_chart: ^0.66.0
  tflite_flutter: ^0.12.1
  google_mlkit_face_detection: ^0.10.0
  http: ^1.1.2
  image: ^4.1.3
  csv: ^6.0.0
  permission_handler: ^11.1.0
  flutter_animate: ^4.3.0
  smooth_page_indicator: ^1.1.0
  share_plus: ^7.2.1
  archive: ^3.4.9
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
